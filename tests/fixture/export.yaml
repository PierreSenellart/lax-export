# The export the integration test runs: every rule of the slicer has a
# target or a module here that exercises it.
library: .
prefix: Fixture
targets:
  - Fixture.main
  - Fixture.uses_secret
  - Fixture.rooted
copyright: 2026 Pierre Senellart
manifest:
  title: "lax-export fixture"
  authors:
    - name: Pierre Senellart
      github: PierreSenellart
abstract: |
  A fixture for `lax-export`: a theorem resting on a coercion, a `@[simp]`
  lemma proved by `rfl`, a macro, declarations in a foreign namespace with a
  derived instance, a generated constant, a private name and a `_root_`
  declaration.
