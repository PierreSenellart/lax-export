# An export of the NP core of the descriptive-complexity library: SAT
# NP-complete under first-order reductions and in Cook–Levin's machine form.
# Copy this file into the folder `lax init` made, as export.yaml, and run
#   lax_export.py export.yaml

library: https://github.com/PierreSenellart/descriptive-complexity   # or a local checkout
ref: v1.2.2                                       # default: HEAD / the default branch
prefix: DescriptiveComplexity                     # the library's top-level namespace
targets:
  - DescriptiveComplexity.SAT_NP_complete
  - DescriptiveComplexity.SAT_complete_for_ntmAccept
# options:                  # elaboration options the library's lakefile sets and its code
#   - maxSynthPendingDepth 3  # needs; this library's build without them, so none are listed
copyright: 2026 Pierre Senellart
manifest:                                         # the Lax archive's manifest.yaml, minus what
  # id: lax-100001                                # `lax init` wrote (the id) and what the tool
                                                  # fills in (the versions)
  title: "Descriptive complexity: first-order reductions and the NP core"
  authors:
    - name: Pierre Senellart
      orcid: "0000-0002-7909-5369"
      github: PierreSenellart
    - name: Claude (Anthropic)
  bibEntries:
    - |
      @misc{senellart2026descriptive,
        author = {Pierre Senellart and Anton Gnatenko},
        title = {Descriptive Complexity in {Lean}: Completeness by First-Order Reductions},
        year = {2026},
        eprint = {2609.18261},
        archivePrefix = {arXiv}
      }
    - |
      @software{senellart2026descriptivecomplexity,
        author = {Pierre Senellart},
        title = {{DescriptiveComplexity}: Completeness by First-Order Reductions in {Lean}},
        version = {1.2.2},
        year = {2026},
        doi = {10.5281/zenodo.21678423},
        url = {https://github.com/PierreSenellart/descriptive-complexity}
      }
