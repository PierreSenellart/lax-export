# An export of the NP core of the descriptive-complexity library: SAT
# NP-complete under first-order reductions and in Cook–Levin's machine form.
# Copy this file into the folder `lax init` made, as export.yaml, and run
#   lax_export.py export.yaml

library: https://github.com/PierreSenellart/descriptive-complexity   # or a local checkout
ref: v1.2.2                                       # default: HEAD / the default branch
prefix: DescriptiveComplexity                     # the library's top-level namespace
targets:
  - DescriptiveComplexity.SAT_NP_complete
  - DescriptiveComplexity.SAT_complete_for_ntmAccept
# options:                  # elaboration options the library's lakefile sets and its code
#   - maxSynthPendingDepth 3  # needs; this library's build without them, so none are listed
copyright: 2026 Pierre Senellart
manifest:                                         # the Lax archive's manifest.yaml, minus what
  # id: lax-100001                                # `lax init` wrote (the id) and what the tool
                                                  # fills in (the versions)
  title: "Descriptive complexity: first-order reductions and the NP core"
  authors:
    - name: Pierre Senellart
      orcid: "0000-0002-7909-5369"
      github: PierreSenellart
    - name: Claude (Anthropic)
  bibEntries:
    - |
      @misc{senellart2026descriptive,
        author = {Pierre Senellart and Anton Gnatenko},
        title = {Descriptive Complexity in {Lean}: Completeness by First-Order Reductions},
        year = {2026},
        eprint = {2609.18261},
        archivePrefix = {arXiv}
      }
    - |
      @software{senellart2026descriptivecomplexity,
        author = {Pierre Senellart},
        title = {{DescriptiveComplexity}: Completeness by First-Order Reductions in {Lean}},
        version = {1.2.2},
        year = {2026},
        doi = {10.5281/zenodo.21678423},
        url = {https://github.com/PierreSenellart/descriptive-complexity}
      }
abstract: |
  Two forms of the NP-completeness of SAT from the descriptive-complexity
  library, with the definitions they rest on: a decision problem is an
  isomorphism-invariant predicate on the finite structures of a relational
  vocabulary; a reduction is a first-order interpretation, with tags for
  disjoint copies and, in the ordered variant, a linear order on the input;
  a complexity class is a set of problems closed under reductions, and NP is
  the class of problems definable in existential second-order logic.

  `SAT_NP_complete`: SAT belongs to NP, and every problem in NP reduces to
  SAT by an ordered first-order reduction, the generic Tseitin reduction
  applied to the problem's existential second-order definition.

  `SAT_complete_for_ntmAccept`: the Cook–Levin theorem in the form the
  machine-based mechanizations prove, SAT complete for the class that
  nondeterministic machine acceptance defines. The library has no model of
  computation: machine acceptance is one more decision problem, whose
  instances are finite structures describing a nondeterministic Turing
  machine, its input and its step budget, and "accepted by a polynomial-time
  machine" means "reduces to that problem by an ordered first-order
  reduction". SAT reduces to machine acceptance, and every problem that
  reduces to machine acceptance reduces to SAT.

  The proofs are those of version 1.2.2 of the library, sliced to what these
  two statements use; the library and its documentation are at
  <https://github.com/PierreSenellart/descriptive-complexity> and
  <https://pierresenellart.github.io/descriptive-complexity/DescriptiveComplexity.html>.
  The Lean code was written with the assistance of several Claude models;
  the design and the statements are the author's.
