name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml pytest
      - run: pytest tests/unit -q

  export:
    name: Export the fixture and build it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the fixture library
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: tests/fixture
          use-mathlib-cache: true
          test: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml pytest
      - name: Export, build and check
        run: pytest tests/test_export.py -q -x
